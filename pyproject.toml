[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maptoposter"
version = "0.1.0"
authors = [
  { name = "MapToPoster Team" }
]
description = "城市极简风地图海报生成工具 - 从OpenStreetMap获取数据，生成精美可打印海报"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "requests>=2.28.0",
    "Pillow>=9.0.0",
    "geopy>=2.2.0",
    "shapely>=1.8.0",
    "numpy>=1.21.0",
    "click>=8.0.0",
    "python-dotenv>=0.19.0",
    "reportlab>=3.5.0",
    "svgwrite>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
maptoposter = "maptoposter.cli.cli:run_cli"

[project.urls]
Homepage = "https://github.com/maptoposter/maptoposter"
Documentation = "https://github.com/maptoposter/maptoposter#readme"
Repository = "https://github.com/maptoposter/maptoposter"
Issues = "https://github.com/maptoposter/maptoposter/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["maptoposter*"]

[tool.setuptools.package-data]
maptoposter = ["i18n/*.json", "themes/*.json"]
